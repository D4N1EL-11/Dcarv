name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    # Fijo en 24.04: desde octubre de 2026 ubuntu-latest es 26.04 y Playwright 1.56 no instala Chromium ahí.
    runs-on: ubuntu-24.04
    env:
      # Solo para las pruebas de extremo a extremo sobre el build de producción: sin JWT_SECRET
      # la app no acepta sesiones (src/lib/auth/secreto.ts). No es la clave de Vercel.
      JWT_SECRET: ci-solo-pruebas-e2e-no-es-la-clave-de-produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
      # Pruebas de extremo a extremo sin base de datos: acceso y barrera de permisos (e2e/).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e